<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MyBikePlanner">
<title>MyBikePlanner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="lib/leaflet.css">
<style>
:root{--bg:#0b1220;--card:#131c2e;--card2:#1a2540;--line:#26334f;--tx:#e8edf7;--mut:#8b9ab8;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--acc:#60a5fa;--pad:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:12px var(--pad) 4px}
header h1{font-size:18px;margin:0;letter-spacing:.2px}
header small{color:var(--mut)}
nav{display:flex;gap:6px;padding:6px var(--pad) 10px;position:sticky;top:0;background:linear-gradient(var(--bg) 80%,transparent);z-index:5}
nav button{flex:1;padding:9px 0;min-width:0;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:10px;font-size:13px}
nav button.on{background:var(--acc);color:#07111f;border-color:var(--acc);font-weight:600}
main{padding:0 var(--pad);display:grid;gap:12px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.card h2{margin:0 0 10px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.hero{text-align:center;padding:18px 14px}
.pill{display:inline-block;font-size:12px;padding:3px 10px;border-radius:99px;background:var(--card2);color:var(--mut);margin-bottom:6px}
.big{font-size:40px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.mut{color:var(--mut)}
.sub{color:var(--mut);font-size:14px;margin-top:4px}
.bar{position:relative;height:16px;border-radius:99px;background:var(--card2);margin:6px 0 2px;overflow:visible}
.bar .f{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--acc)}
.bar .t{position:absolute;top:-5px;bottom:-5px;width:3px;border-radius:2px;background:var(--warn)}
.bar .d{position:absolute;top:-5px;bottom:-5px;width:3px;border-radius:2px;background:var(--bad)}
.lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{background:var(--card2);border-radius:12px;padding:10px}
.k b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.k span{font-size:12px;color:var(--mut)}
.leg{font-size:12px;color:var(--mut);display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11px;color:var(--mut);font-weight:600;text-transform:uppercase}
.wx td{font-variant-numeric:tabular-nums}
input,select{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:7px 8px;font:inherit;width:100%;min-width:0}
td input{padding:5px 6px;font-size:14px}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
button.b{background:var(--acc);color:#07111f;border:0;border-radius:12px;padding:12px 14px;font:inherit;font-weight:600}
button.g{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit}
button.x{background:none;border:0;color:var(--bad);font-size:18px;padding:2px 8px}
.dock{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px var(--pad) calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%);z-index:6;max-width:640px;margin:0 auto}
.dock button{flex:1}
.msg{font-size:13px;margin-top:8px;color:var(--mut)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rt td{padding:8px 3px;font-size:14px}.rt td.num,.rt td:nth-child(n+2){white-space:nowrap}.rt td:first-child{width:36%;font-size:13px}.rt tr.next td{background:var(--card2)}.rt .est{color:var(--mut);font-style:italic}.rt small{display:block;color:var(--mut);font-size:11px}.rt tr.pass td:first-child{color:var(--mut)}
.empty{color:var(--mut);text-align:center;padding:18px 6px}
.num{font-variant-numeric:tabular-nums}

header .lg{display:flex}header h1{flex:1;margin:0 0 0 8px}
header{gap:6px}
.hn{flex:1;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.back{padding:7px 10px!important;font-size:14px}
.ride{cursor:pointer}.ride:active{background:var(--card2)}
.rn{font-size:18px;font-weight:700;margin-bottom:2px}
#map{height:58vh;min-height:360px;border-radius:12px;overflow:hidden}
.leaflet-container{background:#0f1a30;font:inherit}
.leaflet-div-icon{background:none;border:none}
.wmk{display:flex;flex-direction:column;align-items:center}
.wc{width:30px;height:30px;border-radius:50%;border:3px solid #0b1220;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 5px #000a}
.wt{margin-top:2px;font:600 11px system-ui;color:#fff;background:#0b1220d0;padding:1px 6px;border-radius:8px;white-space:nowrap}
.z-lo .wt{display:none}.z-lo .wc{width:18px;height:18px;border-width:2px}.z-lo .wc svg{width:12px;height:12px}
.legend{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--mut);margin:8px 4px 0}
.legend .dot{display:inline-block;width:12px;height:12px;border-radius:50%;border:3px solid;vertical-align:-2px;margin-right:3px}
.legend .ar{color:var(--tx)}
.tbar{display:inline-block;width:90px;height:10px;border-radius:5px;background:linear-gradient(90deg,#3b82f6,#22d3ee,#34d399,#fbbf24,#ef4444)}
input[type=range]{padding:0;height:34px}
.leaflet-popup-content{font:13px/1.4 system-ui;color:#0b1220}
</style>
</head>
<body>
<header id="hdr"></header>
<nav id="nav">
  <button data-tab="dash">Accueil</button>
  <button data-tab="route">Route</button>
  <button data-tab="map">Carte</button>
  <button data-tab="plan">Plan</button>
  <button data-tab="log">Journal</button>
</nav>
<main id="app"></main>
<div class="dock" id="dock">
  <button class="b" data-act="gps">📍 Position GPS</button>
  <button class="g" data-act="manual">✏️ Saisir un passage</button>
</div>
<input type="file" id="gpxfile" accept=".gpx,application/gpx+xml,text/xml,application/xml,*/*" hidden>
<input type="file" id="jsonfile" accept=".json,application/json" hidden>
<script src="lib/leaflet.js"></script>
<script>
// ==CORE==
const RAD = Math.PI / 180;
function hav(la1, lo1, la2, lo2) {
  const dp = (la2 - la1) * RAD, dl = (lo2 - lo1) * RAD;
  const a = Math.sin(dp / 2) ** 2 + Math.cos(la1 * RAD) * Math.cos(la2 * RAD) * Math.sin(dl / 2) ** 2;
  return 12742000 * Math.asin(Math.sqrt(a));
}
function parseGPX(txt) {
  let chunks = txt.split('<trkpt').slice(1);
  if (!chunks.length) chunks = txt.split('<rtept').slice(1);
  const P = [];
  for (const c of chunks) {
    const head = c.slice(0, c.indexOf('>'));
    const la = /lat="([-\d.]+)"/.exec(head), lo = /lon="([-\d.]+)"/.exec(head);
    if (!la || !lo) continue;
    const e = /<ele>\s*([-\d.eE+]+)\s*<\/ele>/.exec(c);
    P.push([+la[1], +lo[1], e ? +e[1] : 0]);
  }
  const nm = /<trk>[\s\S]*?<name>\s*(?:<!\[CDATA\[)?([^<\]]*)/.exec(txt);
  const W = [];
  for (const c0 of txt.split('<wpt').slice(1)) {
    const c = c0.split('</wpt>')[0], head = c.slice(0, c.indexOf('>'));
    const la = /lat="([-\d.]+)"/.exec(head), lo = /lon="([-\d.]+)"/.exec(head), n = /<name>\s*(?:<!\[CDATA\[)?([^<\]]*)/.exec(c);
    if (la && lo && n && n[1].trim()) W.push({ lat: +la[1], lon: +lo[1], name: n[1].trim() });
  }
  return { pts: P, name: nm ? nm[1].trim() : 'Parcours', wpts: W };
}
function buildTrack(P, name) {
  const n = P.length;
  const lat = new Float64Array(n), lon = new Float64Array(n), ele = new Float64Array(n), cum = new Float64Array(n);
  let far = 0, farD = -1, up = 0;
  for (let i = 0; i < n; i++) {
    lat[i] = P[i][0]; lon[i] = P[i][1]; ele[i] = P[i][2];
    if (i) { cum[i] = cum[i - 1] + hav(lat[i - 1], lon[i - 1], lat[i], lon[i]); if (ele[i] > ele[i - 1]) up += ele[i] - ele[i - 1]; }
    const d = hav(lat[0], lon[0], lat[i], lon[i]);
    if (d > farD) { farD = d; far = i; }
  }
  return { n, lat, lon, ele, cum, name, total: cum[n - 1] / 1000, turn: far, turnKm: cum[far] / 1000, ascent: up };
}
function idxAt(T, m) { // first index with cum >= m
  let lo = 0, hi = T.n - 1;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (T.cum[mid] < m) lo = mid + 1; else hi = mid; }
  return lo;
}
function snap(T, lat, lon, kmA, kmB) {
  const i0 = kmA == null ? 0 : idxAt(T, Math.max(0, kmA) * 1000);
  const i1 = kmB == null ? T.n - 1 : Math.min(T.n - 1, idxAt(T, kmB * 1000));
  const k = Math.cos(lat * RAD);
  let best = Infinity, bi = i0;
  for (let i = i0; i <= i1; i++) {
    const dx = (T.lon[i] - lon) * k, dy = T.lat[i] - lat, d = dx * dx + dy * dy;
    if (d < best) { best = d; bi = i; }
  }
  let bestKm = T.cum[bi] / 1000, bestD = Math.sqrt(best) * 111195;
  const mx = 111195 * k, my = 111195;
  for (const j of [bi - 1, bi]) {
    if (j < 0 || j >= T.n - 1) continue;
    const ax = (T.lon[j] - lon) * mx, ay = (T.lat[j] - lat) * my;
    const bx = (T.lon[j + 1] - lon) * mx, by = (T.lat[j + 1] - lat) * my;
    const dx = bx - ax, dy = by - ay, L = dx * dx + dy * dy;
    let t = L ? -(ax * dx + ay * dy) / L : 0; t = Math.max(0, Math.min(1, t));
    const px = ax + t * dx, py = ay + t * dy, d = Math.hypot(px, py);
    if (d < bestD) { bestD = d; bestKm = (T.cum[j] + t * (T.cum[j + 1] - T.cum[j])) / 1000; }
  }
  return { km: bestKm, d: bestD };
}
function posAtKm(T, km) {
  const m = Math.max(0, Math.min(T.total, km)) * 1000;
  const i = Math.max(1, idxAt(T, m));
  const seg = T.cum[i] - T.cum[i - 1] || 1, t = (m - T.cum[i - 1]) / seg;
  return { lat: T.lat[i - 1] + t * (T.lat[i] - T.lat[i - 1]), lon: T.lon[i - 1] + t * (T.lon[i] - T.lon[i - 1]) };
}
function bearingAt(T, km) {
  const a = posAtKm(T, km - 1), b = posAtKm(T, km + 1);
  const y = Math.sin((b.lon - a.lon) * RAD) * Math.cos(b.lat * RAD);
  const x = Math.cos(a.lat * RAD) * Math.sin(b.lat * RAD) - Math.sin(a.lat * RAD) * Math.cos(b.lat * RAD) * Math.cos((b.lon - a.lon) * RAD);
  return (Math.atan2(y, x) / RAD + 360) % 360;
}
const OUT = [['Mortagne-au-Perche', 48.5215, 0.5470], ['Villaines-la-Juhel', 48.3450, -0.2820], ['Fougères', 48.3520, -1.2000],
  ['Tinténiac', 48.3330, -1.8300], ['Loudéac', 48.1790, -2.7480], ['Carhaix-Plouguer', 48.2730, -3.5700], ['Brest', 48.3900, -4.4900]];
const BACK = [['Carhaix-Plouguer', 48.2730, -3.5700], ['Loudéac', 48.1790, -2.7480], ['Tinténiac', 48.3330, -1.8300], ['Fougères', 48.3520, -1.2000],
  ['Villaines-la-Juhel', 48.3450, -0.2820], ['Mortagne-au-Perche', 48.5215, 0.5470], ['Dreux', 48.7367, 1.3669]];
function defaultControls(T, speed = 22, stop = 20) {
  const list = [];
  const add = (n, la, lo, a, b, tag) => {
    const s = snap(T, la, lo, a, b);
    list.push({ name: n + ' ' + tag, km: Math.round(s.km * 10) / 10, speed, stop: n === 'Brest' ? 45 : stop, off: Math.round(s.d) });
  };
  for (const c of OUT) add(c[0], c[1], c[2], 0, T.turnKm + 1, '↗');
  for (const c of BACK) add(c[0], c[1], c[2], T.turnKm - 1, T.total, '↙');
  for (let i = 1; i < list.length; i++) if (list[i].km <= list[i - 1].km) list[i].km = Math.round((list[i - 1].km + 0.1) * 10) / 10;
  list.push({ name: 'Arrivée', km: Math.round(T.total * 10) / 10, speed, stop: 0, off: 0 });
  return list;
}
// plan: [{name,km,arr,dep}] ; index 0 = départ
function buildPlan(controls, depMs) {
  const P = [{ name: 'Départ', km: 0, arr: depMs, dep: depMs, stop: 0 }];
  for (const c of controls) {
    const prev = P[P.length - 1];
    const dist = Math.max(0, c.km - prev.km);
    const arr = prev.dep + (dist / Math.max(1, c.speed)) * 3600e3;
    P.push({ name: c.name, km: c.km, arr, dep: arr + (c.stop || 0) * 60e3, stop: c.stop || 0, speed: c.speed });
  }
  return P;
}
function timeAtKm(P, km) {
  if (km <= 0) return P[0].dep;
  for (let i = 1; i < P.length; i++) {
    if (km <= P[i].km) {
      const a = P[i - 1], b = P[i], span = b.km - a.km;
      return span <= 0 ? b.arr : a.dep + ((km - a.km) / span) * (b.arr - a.dep);
    }
  }
  return P[P.length - 1].arr;
}
function kmAtTime(P, t) {
  if (t <= P[0].dep) return 0;
  for (let i = 1; i < P.length; i++) {
    if (t <= P[i].arr) { const a = P[i - 1], b = P[i]; return a.km + ((t - a.dep) / ((b.arr - a.dep) || 1)) * (b.km - a.km); }
    if (t <= P[i].dep) return P[i].km;
  }
  return P[P.length - 1].km;
}
function computeStatus(P, reading, limitH, mode) {
  const dep = P[0].dep, end = P[P.length - 1], deadline = dep + limitH * 3600e3;
  const plannedFinish = end.arr;
  const out = { deadline, plannedFinish, plannedMargin: deadline - plannedFinish, total: end.km };
  if (!reading) return out;
  const planned = timeAtKm(P, reading.km);
  const delta = planned - reading.t;
  const elP = planned - dep, elA = reading.t - dep;
  const ratio = elP > 3600e3 ? elA / elP : 1;
  const factor = mode === 'real' ? ratio : 1;
  const remPlanned = end.arr - planned;
  const finish = reading.t + remPlanned * factor;
  const etas = P.slice(1).filter(c => c.km > reading.km + 0.05).map(c => ({ name: c.name, km: c.km, eta: reading.t + (c.arr - planned) * factor, stop: c.stop }));
  const remKm = Math.max(0, end.km - reading.km);
  const stopsH = P.slice(1, -1).filter(c => c.km > reading.km + 0.05).reduce((s, c) => s + c.stop / 60, 0) * factor;
  const hLeft = (deadline - reading.t) / 3600e3;
  const minSpeed = hLeft - stopsH > 0 ? remKm / (hLeft - stopsH) : Infinity;
  Object.assign(out, { planned, delta, ratio, factor, finish, margin: deadline - finish, etas, remKm, minSpeed, done: remKm < 0.5 });
  return out;
}
function actualAt(log, km, depMs, tol = 1.5) {
  const L = log.slice().sort((a, b) => a.t - b.t);
  const ex = L.find(r => r.src === 'manuel' && Math.abs(r.km - km) <= tol);
  if (ex) return { t: ex.t, exact: true };
  const A = [{ km: 0, t: depMs }, ...L];
  for (let i = 0; i < A.length - 1; i++) {
    if (A[i].km <= km && km <= A[i + 1].km && A[i + 1].km > A[i].km)
      return { t: A[i].t + (km - A[i].km) / (A[i + 1].km - A[i].km) * (A[i + 1].t - A[i].t), exact: false };
  }
  return null;
}
function brmNominal(km) { return km < 300 ? 200 : km < 400 ? 300 : km < 600 ? 400 : km < 1000 ? 600 : km < 1200 ? 1000 : 1200; }
function brmLimitH(km) { return { 200: 13.5, 300: 20, 400: 27, 600: 40, 1000: 75, 1200: 90 }[brmNominal(km)]; }
function isPBP(T) { return T.total > 1100 && T.total < 1350 && snap(T, 48.39, -4.49, null, null).d < 5000; }
function samplePoints(T, maxN = 45, minStep = 15) {
  const step = Math.max(minStep, Math.ceil(T.total / maxN)), out = [];
  for (let k = 0; k < T.total; k += step) out.push(k);
  out.push(T.total);
  return out.map(km => Object.assign({ km }, posAtKm(T, km), { bearing: bearingAt(T, km) }));
}
function seriesAt(pt, ts) {
  const k = Math.round((ts / 1000 - pt.t0) / 3600);
  if (!pt.temp || k < 0 || k >= pt.temp.length) return null;
  return { temp: pt.temp[k], rain: pt.rain[k], code: pt.code[k], ws: pt.ws[k], wd: pt.wd[k] };
}
function tempColor(t) {
  const st = [[0, [59, 130, 246]], [10, [34, 211, 238]], [18, [52, 211, 153]], [25, [251, 191, 36]], [32, [239, 68, 68]]];
  if (t <= st[0][0]) return 'rgb(' + st[0][1] + ')';
  for (let i = 1; i < st.length; i++) if (t <= st[i][0]) {
    const a = st[i - 1], b = st[i], f = (t - a[0]) / (b[0] - a[0]);
    return 'rgb(' + a[1].map((v, j) => Math.round(v + f * (b[1][j] - v))).join(',') + ')';
  }
  return 'rgb(' + st[4][1] + ')';
}
function windInfo(speed, from, bearing) {
  const c = speed * Math.cos((from - bearing) * RAD);
  return c >= 5 ? { t: 'face', v: Math.round(c) } : c <= -5 ? { t: 'dos', v: Math.round(-c) } : { t: 'côté', v: Math.round(speed) };
}
// ==/CORE==

// ===== État & stockage local =====
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const LOGO = '<svg viewBox="0 0 64 64" width="30" height="30" fill="none" stroke-linecap="round" stroke-linejoin="round"><g stroke="#60a5fa" stroke-width="3.6"><circle cx="15" cy="42" r="11"/><circle cx="49" cy="42" r="11"/></g><g stroke="#e8edf7" stroke-width="3.6"><path d="M15 42L29 42L24 24Z"/><path d="M24 24L43 24L29 42"/><path d="M43 24L49 42"/><path d="M43 24L41.5 18M37.5 18L46.5 18"/><path d="M24 24L23 19M19 19L28 19"/></g></svg>';
let G = { v: 2, rides: [], cur: null };
let S = null; // circuit ouvert (objet de G.rides)
let memOnly = false;
let ui = { tab: 'dash', manual: false, msg: '', wxMsg: '', mapMode: 'pass', mapOff: 0, tiles: true, mapMsg: '', mapView: null };
let mapObj = null, wxLayer = null, mapAll = null;

function newRide(name) {
  const d = new Date(); d.setDate(d.getDate() + 1); d.setHours(7, 0, 0, 0);
  return { id: 'r' + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36), name, kind: 'Circuit', track: null, controls: [], speed: 22, depMs: d.getTime(), limitH: 90, mode: 'plan', log: [], weather: null, mapWx: null };
}
function idb() { return new Promise((res, rej) => { const r = indexedDB.open('mypbp', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function kvGet(k) { const db = await idb(); return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function kvSet(k, v) { const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }
let saveTimer;
function save() { clearTimeout(saveTimer); saveTimer = setTimeout(async () => { try { await kvSet('state', G); } catch (e) { memOnly = true; } }, 250); }
async function load() {
  try {
    const s = await kvGet('state');
    if (s && s.v === 2) G = s;
    else if (s && s.v === 1 && s.track) { // migration de la version mono-circuit
      const r = newRide('Paris-Brest-Paris'); r.kind = 'PBP';
      Object.assign(r, { track: s.track, controls: s.controls, depMs: s.depMs, limitH: s.limitH, mode: s.mode, log: s.log || [], weather: s.weather || null });

    save();
    if (S === ride && ui.tab === 'map') { updateWxLayer(); setMapMsg('Météo mise à jour à l’instant.'); }
  } catch (e) { if (S === ride) setMapMsg('Météo indisponible (réseau). ' + (ride.mapWx ? 'Dernières données conservées.' : '')); }
}

// ===== Plan =====
function renderPlan() {
  let h = '<div class="card"><h2>Circuit</h2><label>Nom</label><input id="rname" value="' + esc(S.name) + '">';
  h += S.track ? '<div class="sub">' + esc(S.kind) + ' · ' + S.track.total.toFixed(0) + ' km · ' + S.track.n + ' points · D+ ≈ ' + Math.round(S.track.ascent) + ' m</div>' : '';
  h += '<div class="row2" style="margin-top:10px"><button class="g" data-act="dup">Dupliquer</button><button class="g" data-act="delride" style="color:var(--bad)">Supprimer</button></div></div>';
  if (!S.track) return h;
  const P = curPlan(), st = computeStatus(P, null, S.limitH, S.mode);
  const nom = brmNominal(S.track.total);
  h += '<div class="card"><h2>Départ & limite</h2><div class="row2"><div><label>Date et heure de départ</label><input type="datetime-local" id="dep" value="' + toInput(S.depMs) + '"></div>' +
    '<div><label>Temps max (h)</label><input type="number" id="lim" value="' + S.limitH + '" step="0.5" inputmode="decimal"></div></div>' +
    '<div class="msg">Délai BRM pour ' + nom + ' km : ' + limLabel(brmLimitH(S.track.total)) + ' · PBP : 90h00. <a href="#" data-act="applybrm" style="color:var(--acc)">Appliquer le délai BRM</a></div>' +
    '<label>Projection de l’arrivée</label><select id="mode"><option value="plan"' + (S.mode === 'plan' ? ' selected' : '') + '>Plan prévu, décalé de mon écart</option><option value="real"' + (S.mode === 'real' ? ' selected' : '') + '>Au rythme réel constaté</option></select>' +
    '<div class="grid" style="margin-top:12px"><div class="k"><span>Durée prévue</span><b>' + fmtDur(st.plannedFinish - S.depMs) + '</b></div><div class="k"><span>Marge sur ' + limLabel(S.limitH) + '</span><b class="' + (st.plannedMargin < 0 ? 'bad' : 'ok') + '">' + (st.plannedMargin < 0 ? '−' : '+') + fmtDur(st.plannedMargin) + '</b></div></div>' +
    '<div class="msg">Arrivée prévue : ' + fmtDT(st.plannedFinish) + '</div></div>';
  const last = S.controls.length - 1;
  h += '<div class="card"><h2>Étapes</h2><table><tr><th>Contrôle</th><th>Km</th><th>km/h</th><th>Arrêt</th><th></th></tr>' +
    S.controls.map((c, i) => '<tr><td>' + esc(c.name) + (c.off > 1500 ? ' ⚠️' : '') + '</td>' +
      '<td><input type="number" data-c="' + i + '" data-f="km" value="' + c.km + '" step="0.1" inputmode="decimal" style="width:62px"></td>' +
      '<td><input type="number" data-c="' + i + '" data-f="speed" value="' + c.speed + '" step="0.5" inputmode="decimal" style="width:52px"></td>' +
      '<td><input type="number" data-c="' + i + '" data-f="stop" value="' + c.stop + '" inputmode="numeric" style="width:52px"></td>' +
      '<td>' + (i < last ? '<button class="x" data-rm="' + i + '">✕</button>' : '') + '</td></tr>').join('') + '</table>' +
    '<div class="msg">« km/h » = vitesse moyenne roulante pour rejoindre ce contrôle depuis le précédent. « Arrêt » en minutes : 90 min ou plus = sommeil 🌙. ⚠️ = contrôle éloigné de la trace, à vérifier.</div>' +
    '<label>Ajouter une étape</label><div class="row2"><input id="an" placeholder="Nom (ex. Contrôle 2)"><input id="ak" type="number" inputmode="decimal" placeholder="Km"></div>' +
    '<div class="row2" style="margin-top:8px"><button class="g" data-act="addstage">＋ Ajouter</button><button class="g" data-act="reset-controls">Réinitialiser</button></div>' +
    '<label>Même vitesse sur toutes les étapes (km/h)</label><div class="row2"><input id="gs" type="number" step="0.5" inputmode="decimal" value="' + S.speed + '"><button class="g" data-act="applyspeed">Appliquer</button></div></div>';
  return h;
}
function renderLog() {
  const L = S.log.slice().sort((a, b) => b.t - a.t);
  let h = '<div class="card"><h2>Positions enregistrées</h2>';
  h += L.length ? '<table><tr><th>Heure</th><th>Km</th><th>Source</th><th></th></tr>' + L.map(r => '<tr><td>' + fmtDT(r.t) + '</td><td class="num">' + r.km.toFixed(1) + '</td><td>' + esc(r.src) + '</td><td><button class="x" data-del="' + r.t + '">✕</button></td></tr>').join('') + '</table>' : '<div class="empty">Rien pour l’instant.</div>';
  h += '</div><div class="card"><h2>Sauvegarde (tous les circuits)</h2><div class="row2"><button class="g" data-act="export">Exporter</button><button class="g" data-act="import">Importer</button></div>' +
    '<div class="msg">' + (memOnly ? '⚠️ Stockage local indisponible : les données seront perdues à la fermeture.' : 'Les données restent sur ce téléphone. L’export est une copie de sécurité (traces GPX comprises).') + '</div></div>';
  return h;
}

// ===== Rendu général =====
function renderHeader() {
  $('#hdr').innerHTML = S
    ? '<button class="g back" data-act="home">‹ Circuits</button><div class="hn">' + esc(S.name) + '</div><small>' + fmtT(Date.now()) + '</small>'
    : '<span class="lg">' + LOGO + '</span><h1>MyBikePlanner</h1><small>' + fmtDT(Date.now()) + '</small>';
}
function render() {
  if (mapObj) { ui.mapView = { c: mapObj.getCenter(), z: mapObj.getZoom() }; mapObj.remove(); mapObj = null; wxLayer = null; }
  renderHeader();
  $('#nav').style.display = S ? 'flex' : 'none';
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === ui.tab));
  $('#dock').style.display = S && S.track && (ui.tab === 'dash' || ui.tab === 'route') ? 'flex' : 'none';
  const y = window.scrollY;
  $('#app').innerHTML = !S ? renderHome() : ui.tab === 'dash' ? renderDash() : ui.tab === 'route' ? renderRoute() : ui.tab === 'map' ? renderMap() : ui.tab === 'plan' ? renderPlan() : renderLog();
  window.scrollTo(0, y);
  if (S && ui.tab === 'map') initMap();
}

// ===== Actions =====
function addLog(km, t, src) { S.log = S.log.filter(r => !(Math.abs(r.t - t) < 30000)); S.log.push({ t, km, src }); save(); }
function updateGPS(silent) {
  if (!S || !S.track) return;
  const ride = S;
  if (!navigator.geolocation) { ui.msg = 'GPS indisponible sur cet appareil.'; render(); return; }
  if (!silent) { ui.msg = 'Recherche de position…'; render(); }
  navigator.geolocation.getCurrentPosition(pos => {
    if (S !== ride) return;
    const T = S.track, now = Date.now(), lat = pos.coords.latitude, lon = pos.coords.longitude;
    const rd = lastReading();
    let s = rd ? snap(T, lat, lon, rd.km - 20, rd.km + 250) : snap(T, lat, lon, 0, null);
    if (s.d > 3000) s = snap(T, lat, lon, 0, null);
    if (s.d > 3000) { ui.msg = 'Position à ' + (s.d / 1000).toFixed(1) + ' km du parcours : non enregistrée.'; }
    else if (now < S.depMs - 30 * 60e3) { ui.msg = 'Avant le départ : position non enregistrée (km ' + s.km.toFixed(1) + ').'; }
    else { addLog(s.km, now, 'GPS'); ui.msg = ''; }
    render(); refreshWeather(false);
  }, err => { if (S !== ride) return; ui.msg = 'GPS : ' + (err.code === 1 ? (window.isSecureContext ? 'autorisation refusée (vérifie les réglages de localisation)' : 'bloqué car la page n’est pas en HTTPS') : err.code === 3 ? 'délai dépassé' : 'position indisponible'); render(); },
  { enableHighAccuracy: true, timeout: 20000, maximumAge: 30000 });
}
async function refreshWeather(force) {
  if (!S || !S.track) return;
  const ride = S;
  if (!navigator.onLine) { ui.wxMsg = 'Hors ligne : dernières prévisions affichées.'; if (ui.tab === 'dash') render(); return; }
  const P = curPlan(), rd = lastReading(), st = computeStatus(P, rd, S.limitH, S.mode);
  if (!force && S.weather && Date.now() - S.weather.at < 20 * 60e3 && S.weather.km === (rd ? Math.round(rd.km) : 0)) return;
  const tg = wxTargets(P, rd, st);
  const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + tg.map(x => x.lat.toFixed(3)).join(',') + '&longitude=' + tg.map(x => x.lon.toFixed(3)).join(',') +
    '&hourly=temperature_2m,precipitation,weather_code,wind_speed_10m,wind_direction_10m&wind_speed_unit=kmh&timeformat=unixtime&timezone=GMT&forecast_days=16';
  try {
    const r = await fetch(url); if (!r.ok) throw new Error(r.status);
    let j = await r.json(); if (!Array.isArray(j)) j = [j];
    const items = tg.map((x, i) => {
      const H = j[i].hourly, k = Math.round((x.ts / 1000 - H.time[0]) / 3600);
      if (k < 0 || k >= H.time.length) return { label: x.label, ts: x.ts, na: true };
      return { label: x.label, ts: x.ts, code: H.weather_code[k], temp: H.temperature_2m[k], rain: H.precipitation[k], wind: windInfo(H.wind_speed_10m[k], H.wind_direction_10m[k], x.bearing) };
    });
    ride.weather = { at: Date.now(), km: rd ? Math.round(rd.km) : 0, items }; ui.wxMsg = ''; save();
  } catch (e) { ui.wxMsg = 'Météo indisponible (réseau). Dernières données conservées.'; }
  if (S === ride && ui.tab === 'dash') render();
}
function resetControls() { S.controls = S.kind === 'PBP' ? defaultControls(S.track) : S.controls.slice(-1).map(c => Object.assign({}, c, { speed: S.speed })); save(); }
async function createRide(file) {
  const g = parseGPX(await file.text());
  if (g.pts.length < 2) { alert('GPX illisible : aucune trace trouvée.'); return; }
  const T = buildTrack(g.pts, g.name);
  const r = newRide((file.name || '').replace(/\.gpx$/i, '').replace(/[_]+/g, ' ').trim() || g.name);
  r.track = T; r.speed = T.total <= 400 ? 25 : T.total <= 700 ? 23 : 22;
  if (isPBP(T)) {
    r.kind = 'PBP'; r.controls = defaultControls(T, 22, 20); r.limitH = 90; r.depMs = new Date(2027, 7, 15, 17, 0).getTime();
  } else {
    r.kind = T.total <= 1300 ? 'BRM ' + brmNominal(T.total) : 'Circuit'; r.limitH = T.total <= 1300 ? brmLimitH(T.total) : Math.ceil(T.total / 15);
    const C = [];
    if (g.wpts.length && g.wpts.length <= 15) {
      for (const w of g.wpts) { const s = snap(T, w.lat, w.lon, null, null); if (s.d <= 1500 && s.km > 1 && s.km < T.total - 1) C.push({ name: w.name, km: Math.round(s.km * 10) / 10, speed: r.speed, stop: 10, off: Math.round(s.d) }); }
      C.sort((a, b) => a.km - b.km);
    }
    r.controls = C.filter((c, i) => !i || c.km - C[i - 1].km > 0.5);
    r.controls.push({ name: 'Arrivée', km: Math.round(T.total * 10) / 10, speed: r.speed, stop: 0, off: 0 });
  }
  G.rides.push(r); save(); openRide(r.id);
}
function openRide(id) {
  const r = G.rides.find(x => x.id === id); if (!r) return;
  S = r; G.cur = id; ui = Object.assign(ui, { tab: 'dash', manual: false, msg: '', wxMsg: '', mapMsg: '', mapView: null, mapOff: 0, mapMode: 'pass' });
  save(); try { history.pushState({ r: 1 }, ''); } catch (e) {}
  render();
  if (S.track) { updateGPS(true); refreshWeather(false); }
}
function goHome() { S = null; G.cur = null; ui.mapView = null; save(); render(); }

document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]'); if (tab) { ui.tab = tab.dataset.tab; ui.manual = false; ui.mapView = ui.tab === 'map' ? ui.mapView : null; render(); return; }
  const op = e.target.closest('[data-open]'); if (op) { openRide(op.dataset.open); return; }
  const del = e.target.closest('[data-del]'); if (del) { S.log = S.log.filter(r => r.t !== +del.dataset.del); save(); render(); return; }
  const rm = e.target.closest('[data-rm]'); if (rm) { S.controls.splice(+rm.dataset.rm, 1); S.weather = null; save(); render(); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (a.tagName === 'A') e.preventDefault();
  if (act === 'new') $('#gpxfile').click();
  else if (act === 'home') { if (history.state && history.state.r) history.back(); else goHome(); }
  else if (act === 'gps') updateGPS(false);
  else if (act === 'manual') { ui.manual = true; render(); const m = document.getElementById('mc'); m && m.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  else if (act === 'manual-cancel') { ui.manual = false; render(); }
  else if (act === 'manual-ok') {
    const c = S.controls[+$('#mc').value], t = new Date($('#mt').value).getTime(), kv = parseFloat($('#mk').value);
    if (isNaN(t)) return;
    addLog(isNaN(kv) ? c.km : Math.min(S.track.total, Math.max(0, kv)), t, 'manuel'); ui.manual = false; render();
  }
  else if (act === 'reset-controls') { if (confirm('Réinitialiser les étapes ?')) { resetControls(); render(); } }
  else if (act === 'addstage') {
    const n = $('#an').value.trim(), k = parseFloat($('#ak').value);
    if (!n || isNaN(k) || k <= 0 || k >= S.track.total) { alert('Indique un nom et un kilomètre entre 0 et ' + S.track.total.toFixed(0) + '.'); return; }
    S.controls.push({ name: n, km: k, speed: S.speed, stop: 10, off: 0 }); S.controls.sort((x, y) => x.km - y.km); S.weather = null; save(); render();
  }
  else if (act === 'applyspeed') { const v = parseFloat($('#gs').value); if (v > 0) { S.speed = v; S.controls.forEach(c => c.speed = v); save(); render(); } }
  else if (act === 'applybrm') { S.limitH = brmLimitH(S.track.total); save(); render(); }
  else if (act === 'dup') {
    const c = structuredClone(S); c.id = 'r' + Date.now().toString(36); c.name = S.name + ' (copie)'; c.log = []; c.weather = null; c.mapWx = null;
    G.rides.push(c); save(); openRide(c.id);
  }
  else if (act === 'delride') { if (confirm('Supprimer « ' + S.name + ' » et toutes ses positions ?')) { G.rides = G.rides.filter(r => r !== S); goHome(); } }
  else if (act === 'mapmode-pass') { ui.mapMode = 'pass'; render(); }
  else if (act === 'mapmode-hour') { ui.mapMode = 'hour'; render(); }
  else if (act === 'maprefresh') fetchMapWeather(true);
  else if (act === 'mapfit-all') { if (mapObj && mapAll) mapObj.fitBounds(mapAll); }
  else if (act === 'mapfit-me') { if (lastReading()) fitAhead(); else setMapMsg('Aucune position enregistrée : touche « Position GPS » dans l’onglet Accueil.'); }
  else if (act === 'export') {
    const blob = new Blob([JSON.stringify(G)], { type: 'application/json' });
    const u = URL.createObjectURL(blob), l = document.createElement('a'); l.href = u; l.download = 'mybikeplanner-sauvegarde.json'; l.click(); setTimeout(() => URL.revokeObjectURL(u), 2000);
  }
  else if (act === 'import') $('#jsonfile').click();
});
document.addEventListener('input', e => {
  if (e.target.id === 'wxs') { ui.mapOff = +e.target.value; const l = $('#wxl'); if (l) l.textContent = wxLabel(); updateWxLayer(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'gpxfile' && t.files[0]) { createRide(t.files[0]); t.value = ''; }
  else if (t.id === 'jsonfile' && t.files[0]) t.files[0].text().then(x => {
    try {
      const j = JSON.parse(x);
      if (j.v === 2 && Array.isArray(j.rides)) { G = j; S = null; G.cur = null; save(); render(); } else alert('Fichier de sauvegarde non reconnu.');
    } catch (er) { alert('Fichier invalide.'); }
  });
  else if (t.id === 'rname') { S.name = t.value.trim() || S.name; save(); renderHeader(); }
  else if (t.id === 'dep') { const v = new Date(t.value).getTime(); if (!isNaN(v)) { S.depMs = v; S.mapWx = null; save(); render(); } }
  else if (t.id === 'lim') { S.limitH = Math.max(1, +t.value || 90); save(); render(); }
  else if (t.id === 'mode') { S.mode = t.value; save(); render(); }
  else if (t.id === 'tiles') { ui.tiles = t.checked; render(); }
  else if (t.dataset && t.dataset.c != null) {
    const c = S.controls[+t.dataset.c], v = parseFloat(t.value); if (isNaN(v)) return;
    c[t.dataset.f] = v; c.off = 0;
    if (t.dataset.f === 'km') S.controls.sort((x, y) => x.km - y.km);
    S.weather = null; save(); render();
  }
});
window.addEventListener('popstate', () => { if (S) goHome(); });

(async function init() {
  await load(); render();
  try { if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !window.Capacitor) navigator.serviceWorker.register('sw.js'); } catch (e) {}
  if (S) { try { history.pushState({ r: 1 }, ''); } catch (e) {} if (S.track) { updateGPS(true); refreshWeather(false); } }
  setInterval(() => { if (!document.hidden && !ui.manual && (!S || ui.tab === 'dash' || ui.tab === 'route')) render(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && S && S.track) { updateGPS(true); refreshWeather(false); } });
})();
</script>
</body>
</html>
