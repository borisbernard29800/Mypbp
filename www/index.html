<script src="lib/leaflet.js"></script>
<script>
// ==CORE==
const RAD = Math.PI / 180;
function hav(la1, lo1, la2, lo2) {
  const dp = (la2 - la1) * RAD, dl = (lo2 - lo1) * RAD;
  const a = Math.sin(dp / 2) ** 2 + Math.cos(la1 * RAD) * Math.cos(la2 * RAD) * Math.sin(dl / 2) ** 2;
  return 12742000 * Math.asin(Math.sqrt(a));
}
function parseGPX(txt) {
  let chunks = txt.split('<trkpt').slice(1);
  if (!chunks.length) chunks = txt.split('<rtept').slice(1);
  const P = [];
  for (const c of chunks) {
    const head = c.slice(0, c.indexOf('>'));
    const la = /lat="([-\d.]+)"/.exec(head), lo = /lon="([-\d.]+)"/.exec(head);
    if (!la || !lo) continue;
    const e = /<ele>\s*([-\d.eE+]+)\s*<\/ele>/.exec(c);
    P.push([+la[1], +lo[1], e ? +e[1] : 0]);
  }
  const nm = /<trk>[\s\S]*?<name>\s*(?:<!\[CDATA\[)?([^<\]]*)/.exec(txt);
  const W = [];
  for (const c0 of txt.split('<wpt').slice(1)) {
    const c = c0.split('</wpt>')[0], head = c.slice(0, c.indexOf('>'));
    const la = /lat="([-\d.]+)"/.exec(head), lo = /lon="([-\d.]+)"/.exec(head), n = /<name>\s*(?:<!\[CDATA\[)?([^<\]]*)/.exec(c);
    if (la && lo && n && n[1].trim()) W.push({ lat: +la[1], lon: +lo[1], name: n[1].trim() });
  }
  return { pts: P, name: nm ? nm[1].trim() : 'Parcours', wpts: W };
}
function buildTrack(P, name) {
  const n = P.length;
  const lat = new Float64Array(n), lon = new Float64Array(n), ele = new Float64Array(n), cum = new Float64Array(n);
  let far = 0, farD = -1, up = 0;
  for (let i = 0; i < n; i++) {
    lat[i] = P[i][0]; lon[i] = P[i][1]; ele[i] = P[i][2];
    if (i) { cum[i] = cum[i - 1] + hav(lat[i - 1], lon[i - 1], lat[i], lon[i]); if (ele[i] > ele[i - 1]) up += ele[i] - ele[i - 1]; }
    const d = hav(lat[0], lon[0], lat[i], lon[i]);
    if (d > farD) { farD = d; far = i; }
  }
  return { n, lat, lon, ele, cum, name, total: cum[n - 1] / 1000, turn: far, turnKm: cum[far] / 1000, ascent: up };
}
function idxAt(T, m) { // first index with cum >= m
  let lo = 0, hi = T.n - 1;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (T.cum[mid] < m) lo = mid + 1; else hi = mid; }
  return lo;
}
function snap(T, lat, lon, kmA, kmB) {
  const i0 = kmA == null ? 0 : idxAt(T, Math.max(0, kmA) * 1000);
  const i1 = kmB == null ? T.n - 1 : Math.min(T.n - 1, idxAt(T, kmB * 1000));
  const k = Math.cos(lat * RAD);
  let best = Infinity, bi = i0;
  for (let i = i0; i <= i1; i++) {
    const dx = (T.lon[i] - lon) * k, dy = T.lat[i] - lat, d = dx * dx + dy * dy;
    if (d < best) { best = d; bi = i; }
  }
  let bestKm = T.cum[bi] / 1000, bestD = Math.sqrt(best) * 111195;
  const mx = 111195 * k, my = 111195;
  for (const j of [bi - 1, bi]) {
    if (j < 0 || j >= T.n - 1) continue;
    const ax = (T.lon[j] - lon) * mx, ay = (T.lat[j] - lat) * my;

fr: { back: '‹ Retour', title: 'Aide · MyBikePlanner', intro: 'Suivre une sortie (PBP, BRM…) par rapport au planning prévu. Tout reste sur ce téléphone : aucun compte, aucun serveur. Touche un titre pour déplier.',
 secs: [
  ['🚀 Démarrer en 3 étapes', '<ol><li><b>Importe un GPX</b> : « ＋ Nouveau circuit » sur l’accueil, ou depuis l’Agenda (« Planifier une sortie »).</li><li>Dans l’onglet <b>Plan</b>, choisis le <b>type</b> (Sortie libre, BRM ou PBP), la <b>date et l’heure de départ</b>, puis les vitesses.</li><li>Le jour J, ouvre l’app et touche <b>📍 Position GPS</b>.</li></ol><p>Le type n’est jamais deviné : c’est toi qui le choisis. Il règle le délai maximum (BRM 200 = 13 h 30, 300 = 20 h, 400 = 27 h, 600 = 40 h, 1000 = 75 h ; PBP = 90 h). La limite est <b>facultative</b> : dans Plan, l’interrupteur « Limite horaire » l’active ou non (par défaut : activée pour BRM/PBP, désactivée pour une sortie libre).</p>', true],
  ['🏠 Accueil et circuits', '<p>Chaque carte est un circuit (distance, dénivelé, limite, état). Touche-la pour l’ouvrir. L’icône 🗑 la supprime après confirmation.</p><p>Les circuits à venir sont classés par date de départ, les terminés en bas.</p>'],
  ['🌤️ Menu, météo et import', '<p><b>☰</b> (en haut à gauche) ouvre le menu : Circuits, Agenda, import GPX, Réglages, Aide, À propos.</p><p>L’accueil affiche la météo de ta position (relevée à l’ouverture de l’appli, avec les prochaines heures). Hors connexion, la dernière météo est conservée.</p><p><b>Récupérer un tracé</b> : touche Strava, Komoot, Garmin ou Ride with GPS pour voir comment exporter le GPX, puis « Choisir le fichier GPX ». Une connexion directe au compte n’est pas possible sans serveur.</p>'],
  ['📅 Agenda', '<p>Le calendrier montre un point par sortie (bleu BRM, orange PBP, vert sortie libre). Touche un jour pour voir ses sorties, « tout voir » pour revenir à la liste.</p><p><b>Planifier une sortie</b> : choisis la date, le type, puis « Nouveau GPX… » ou la copie d’un circuit déjà importé (pratique pour un parcours refait plusieurs fois). La copie repart sans positions ni météo.</p>'],
  ['🗺️ Onglet Plan', '<ul><li><b>Départ</b> : heure de départ. L’interrupteur <b>Limite horaire</b> active ou non un temps maximum (activé par défaut pour un BRM ou un PBP, désactivé pour une sortie libre) ; activé, il affiche marge et vitesse minimale.</li><li><b>Étapes</b> : pour chaque contrôle, la <b>distance depuis l’étape précédente</b> (+ X km sous le nom), le <b>nom (touche-le : le texte est sélectionné, ou ✕ pour l’effacer, puis tape le nouveau)</b>, le km, la <b>vitesse moyenne roulante</b> pour le rejoindre depuis le précédent, et l’<b>arrêt</b> en minutes (90 min ou plus = sommeil 🌙).</li><li><b>Même vitesse</b> : applique une vitesse à toutes les étapes d’un coup.</li><li><b>Tolérance GPS</b> : distance maximale entre toi et la trace pour enregistrer ta position (3 km par défaut ; mets 10 km pour un test en train).</li><li><b>Projection de l’arrivée</b> : « plan décalé de mon écart » ou « au rythme réel constaté ».</li><li><b>Dupliquer / Supprimer</b> le circuit.</li></ul>'],
  ['📍 Suivre en course', '<p><b>Position GPS</b> : l’app lit ta position à l’ouverture ou quand tu touches le bouton, la projette sur la trace et enregistre un point. Il n’y a <b>aucun suivi en arrière-plan</b> : la batterie est préservée.</p><p><b>Saisir un passage</b> : pour noter à la main l’heure à laquelle tu es passé à un contrôle (heure exacte). Utile sans réseau GPS ou pour corriger.</p><p>L’écran d’accueil du circuit indique l’<b>avance / le retard</b> sur le prévu, la marge sur la limite, la vitesse minimale pour tenir le délai et les prochains passages recalculés.</p>'],
  ['🏁 Mode course (affichage épuré)', '<p>Bouton « 🏁 Mode course » en haut de l’Accueil du circuit. Pensé pour la fatigue : gros chiffres, un seul bouton.</p><ul><li><b>Course</b> : avance/retard, prochaine étape (km, <b>distance restante jusqu’à elle</b>, heure estimée, heure prévue), reste et arrivée. Le bouton <b>« Je suis à l’étape »</b> ouvre le pointage ; l’icône cible (en haut à droite) met à jour le GPS.</li><li><b>Étapes</b> : feuille de route, la prochaine est encadrée.</li><li><b>Météo</b> : température, pluie et vent aux prochaines étapes.</li><li><b>Pointage</b> : l’heure est proposée, ajuste avec −5 / +5 min, puis <b>Valider</b>.</li><li><b>Détails</b> : retour à l’app complète.</li></ul><p>Sans étapes intermédiaires, l’écran se simplifie et le gros bouton devient « Ma position ».</p>'],
  ['📋 Onglet Route (feuille de route)', '<p>Tableau <b>prévu / réel / écart ±</b>. <b>Touche une étape</b> pour saisir ou corriger son heure de passage (autant de fois que nécessaire, avec « Supprimer ce passage » pour l’annuler). Les passages déjà effectués utilisent l’heure réelle (exacte si saisie à la main, « ≈ » si interpolée). Les suivants affichent une estimation en italique.</p>'],
  ['🌦️ Carte et météo', '<ul><li><b>Flèches</b> le long du tracé : sens du vent (vers où il souffle). <span style="color:#ef4444">Rouge</span> = de face, <span style="color:#22c55e">vert</span> = dans le dos, gris = de côté. Touche une flèche pour le détail.</li><li><b>Couleur du trajet</b> : <b>Pente</b> (par défaut : bleu = descente, vert &lt; 3 %, jaune 3–6 %, orange 6–9 %, rouge &gt; 9 %) ou <b>Température</b> (bleu froid → rouge chaud). <b>Halo bleu</b> = pluie, plus épais si plus fort.</li><li><b>Calques</b> : Vent et Pluie activables séparément.</li><li><b>Moment affiché</b> : « À mon passage » (météo à l’heure prévue de passage en chaque point) ou « Heure fixe » avec curseur.</li><li><b>Noter un passage depuis la carte</b> : touche le tracé, puis « Noter un passage ici » ; le kilomètre est prérempli, tu ajustes l’heure et tu enregistres. <b>Devant moi / Tout le parcours</b> : cadrage. Les étapes sont les points violets étiquetés.</li><li><b>Profil d’altitude</b> sous la carte : pente en couleur, étapes en pointillés violets, ta position (orange). Le <b>curseur</b> (ou ▶ pour « jouer » le parcours, ×1 à ×8) déplace un point sur la carte et affiche km, altitude, pente, heure de passage et D+ restant. Touche ou fais glisser le profil pour aller à un endroit.</li><li><b>Courbes</b> sous la carte : température et ressentie, précipitations (probabilité, intensité) et nuages, vent et rafales, altitude, en fonction de l’heure de passage.</li></ul><p>Les prévisions viennent d’Open-Meteo et ne portent que sur <b>7 jours</b> : pour un départ plus lointain, elles apparaissent à l’approche. Hors ligne, les dernières données reçues restent affichées.</p><p>Le fond de carte (OpenStreetMap) est facultatif : décoche-le pour économiser les données ; le tracé reste visible.</p>'],
  ['💾 Sauvegarde et données', '<p>⚙ Réglages → <b>Exporter</b> crée un fichier de sauvegarde de tous les circuits (traces comprises) et ouvre le partage Android : enregistre-le dans Drive, envoie-le par mail ou vers tes fichiers. <b>Importer</b> fusionne le fichier avec tes circuits actuels (un circuit de même identifiant est remplacé).</p><p>Les données sont stockées dans l’app. Désinstaller l’app les efface : fais un export avant. Mettre à jour l’APK par-dessus l’ancien les conserve.</p>'],
  ['🌗 Jour / nuit', '<p>Bouton <b>⚙</b> en haut : choisis <b>Automatique</b> (nuit entre coucher et lever du soleil, calculés d’après ton parcours), <b>Réglage du téléphone</b>, <b>Jour</b> ou <b>Nuit</b>.</p>'],
  ['🌐 Langue', '<p>⚙ Réglages → <b>Langue</b> : français, English, Español ou Deutsch. L’app te demande la langue au tout premier lancement. Les noms d’étapes issus du GPX ou saisis par toi ne sont pas traduits.</p>'],
  ['🛟 Dépannage', '<ul><li><b>« Autorisation refusée »</b> : active la localisation pour l’app dans les réglages Android.</li><li><b>« Position à X km du parcours : non enregistrée »</b> : tu es hors tolérance. Augmente la tolérance dans Plan, ou saisis le passage à la main.</li><li><b>« Avant le départ »</b> : la position n’est enregistrée qu’à partir de 30 min avant l’heure de départ.</li><li><b>Météo indisponible</b> : pas de réseau ; réessaie avec « ↻ Actualiser ».</li><li><b>Départ modifié mais heures inchangées</b> : touche « ↻ Actualiser » dans Météo.</li><li><b>Bouton retour Android</b> : revient à la liste des circuits.</li></ul>']
 ], foot: 'MyBikePlanner · usage personnel · estimations indicatives, pas un chronométrage officiel.' },

en: { back: '‹ Back', title: 'Help · MyBikePlanner', intro: 'Follow a ride (PBP, BRM…) against its planned schedule. Everything stays on this phone: no account, no server. Tap a title to expand.',
 secs: [
  ['🚀 Get started in 3 steps', '<ol><li><b>Import a GPX</b>: “＋ New ride” on the home screen, or from the Calendar (“Plan a ride”).</li><li>In the <b>Plan</b> tab, choose the <b>type</b> (Free ride, BRM or PBP), the <b>start date and time</b>, then the speeds.</li><li>On the day, open the app and tap <b>📍 GPS position</b>.</li></ol><p>The type is never guessed: you choose it. It sets the maximum time (BRM 200 = 13 h 30, 300 = 20 h, 400 = 27 h, 600 = 40 h, 1000 = 75 h; PBP = 90 h). The limit is <b>optional</b>: in Plan, the “Time limit” switch turns it on or off (default: on for BRM/PBP, off for a free ride).</p>', true],
  ['🏠 Home and rides', '<p>Each card is a ride (distance, climbing, limit, status). Tap it to open it. The 🗑 icon deletes it after confirmation.</p><p>Upcoming rides are sorted by start date, finished ones at the bottom.</p>'],
  ['🌤️ Menu, weather and import', '<p><b>☰</b> (top left) opens the menu: Rides, Agenda, GPX import, Settings, Help, About.</p><p>The home screen shows the weather at your location (read when the app opens, with the next hours). Offline, the last weather is kept.</p><p><b>Get a route</b>: tap Strava, Komoot, Garmin or Ride with GPS to see how to export the GPX, then “Choose the GPX file”. A direct account connection is not possible without a server.</p>'],
  ['📅 Calendar', '<p>The calendar shows one dot per ride (blue BRM, orange PBP, green free ride). Tap a day to see its rides, “show all” to go back to the list.</p><p><b>Plan a ride</b>: choose the date, the type, then “New GPX…” or a copy of an already imported ride (handy for a route you ride several times). The copy starts without positions or weather.</p>'],
  ['🗺️ Plan tab', '<ul><li><b>Start</b>: start time. The <b>Time limit</b> switch turns a maximum time on or off (on by default for a BRM or PBP, off for a free ride); when on, it shows margin and minimum speed.</li><li><b>Stages</b>: for each control, the <b>distance from the previous stage</b> (+ X km under the name), the <b>name (tap it: the text is selected, or ✕ to clear it, then type the new one)</b>, the km, the <b>average moving speed</b> to reach it from the previous one, and the <b>stop</b> in minutes (90 min or more = sleep 🌙).</li><li><b>Same speed</b>: applies one speed to all stages at once.</li><li><b>GPS tolerance</b>: maximum distance between you and the track for your position to be recorded (3 km by default; use 10 km for a test on a train).</li><li><b>Finish projection</b>: “planned schedule shifted by my gap” or “at my actual pace”.</li><li><b>Duplicate / Delete</b> the ride.</li></ul>'],
  ['📍 Following a ride', '<p><b>GPS position</b>: the app reads your position when opened or when you tap the button, projects it onto the track and records a point. There is <b>no background tracking</b>: your battery is preserved.</p><p><b>Enter a passage</b>: to note by hand the time you passed a control (exact time). Useful without GPS signal or to correct.</p><p>The ride’s home screen shows your <b>lead / delay</b> against the plan, the margin on the limit, the minimum speed to meet the time limit and the recalculated next passages.</p>'],
  ['🏁 Race mode (clean display)', '<p>“🏁 Race mode” button at the top of the ride’s Home. Designed for fatigue: big numbers, a single button.</p><ul><li><b>Race</b>: lead/delay, next stage (km, <b>distance left to it</b>, estimated time, planned time), remaining distance and finish. The <b>“I’m at the stage”</b> button opens the check-in; the target icon (top right) refreshes the GPS.</li><li><b>Stages</b>: road book, the next one is framed.</li><li><b>Weather</b>: temperature, rain and wind at the next stages.</li><li><b>Check-in</b>: the time is suggested, adjust with −5 / +5 min, then <b>Confirm</b>.</li><li><b>Details</b>: back to the full app.</li></ul><p>Without intermediate stages, the screen is simplified and the big button becomes “My position”.</p>'],
  ['📋 Route tab (road book)', '<p>Table <b>planned / actual / gap ±</b>. <b>Tap a stage</b> to enter or correct its passage time (as often as needed, with “Delete this passage” to undo it). Passages already made use the actual time (exact if entered by hand, “≈” if interpolated). The following ones show an estimate in italics.</p>'],
  ['🌦️ Map and weather', '<ul><li><b>Arrows</b> along the track: wind direction (where it blows to). <span style="color:#ef4444">Red</span> = headwind, <span style="color:#22c55e">green</span> = tailwind, grey = crosswind. Tap an arrow for details.</li><li><b>Route colour</b>: <b>Slope</b> (default: blue = descent, green &lt; 3 %, yellow 3–6 %, orange 6–9 %, red &gt; 9 %) or <b>Temperature</b> (cold blue → hot red). <b>Blue halo</b> = rain, thicker when heavier.</li><li><b>Layers</b>: Wind and Rain can be switched on and off separately.</li><li><b>Time shown</b>: “At my passage” (weather at the planned passage time at each point) or “Fixed time” with a slider.</li><li><b>Note a passage from the map</b>: tap the track, then “Note a passage here”; the kilometre is prefilled, adjust the time and save. <b>Ahead of me / Whole route</b>: framing. Stages are the labelled purple points.</li><li><b>Elevation profile</b> under the map: slope in colour, stages as purple dotted lines, your position (orange). The <b>cursor</b> (or ▶ to “play” the route, ×1 to ×8) moves a point on the map and shows km, altitude, slope, passage time and remaining D+. Tap or drag the profile to jump to a place.</li><li><b>Curves</b> under the map: temperature and feels-like, precipitation (probability, intensity) and clouds, wind and gusts, altitude, as a function of passage time.</li></ul><p>Forecasts come from Open-Meteo and cover only <b>7 days</b>: for a later start, they appear as it approaches. Offline, the last data received stays displayed.</p><p>The base map (OpenStreetMap) is optional: untick it to save data; the track remains visible.</p>'],
  ['💾 Backup and data', '<p>⚙ Settings → <b>Export</b> creates a backup file of all rides (tracks included) and opens Android sharing: save it to Drive, email it or send it to your files. <b>Import</b> merges the file with your current rides (a ride with the same identifier is replaced).</p><p>Data is stored in the app. Uninstalling the app erases it: export first. Updating the APK over the old one keeps it.</p>'],
  ['🌗 Day / night', '<p><b>⚙</b> button at the top: choose <b>Automatic</b> (night between sunset and sunrise, computed from your route), <b>Phone setting</b>, <b>Day</b> or <b>Night</b>.</p>'],
  ['🌐 Language', '<p>⚙ Settings → <b>Language</b>: français, English, Español or Deutsch. The app asks for the language on the very first launch. Stage names coming from the GPX or typed by you are not translated.</p>'],
  ['🛟 Troubleshooting', '<ul><li><b>“Permission denied”</b>: enable location for the app in the Android settings.</li><li><b>“Position X km from the route: not recorded”</b>: you are outside the tolerance. Increase the tolerance in Plan, or enter the passage by hand.</li><li><b>“Before the start”</b>: the position is only recorded from 30 min before the start time.</li><li><b>Weather unavailable</b>: no network; try again with “↻ Refresh”.</li><li><b>Start changed but times unchanged</b>: tap “↻ Refresh” in Weather.</li><li><b>Android back button</b>: returns to the ride list.</li></ul>']
 ], foot: 'MyBikePlanner · personal use · indicative estimates, not official timing.' },

es: { back: '‹ Volver', title: 'Ayuda · MyBikePlanner', intro: 'Sigue una salida (PBP, BRM…) respecto al plan previsto. Todo se queda en este teléfono: sin cuenta, sin servidor. Toca un título para desplegar.',
 secs: [
  ['🚀 Empezar en 3 pasos', '<ol><li><b>Importa un GPX</b>: «＋ Nuevo recorrido» en el inicio, o desde la Agenda («Planificar una salida»).</li><li>En la pestaña <b>Plan</b>, elige el <b>tipo</b> (Salida libre, BRM o PBP), la <b>fecha y hora de salida</b> y luego las velocidades.</li><li>El día D, abre la app y toca <b>📍 Posición GPS</b>.</li></ol><p>El tipo nunca se adivina: lo eliges tú. Fija el plazo máximo (BRM 200 = 13 h 30, 300 = 20 h, 400 = 27 h, 600 = 40 h, 1000 = 75 h; PBP = 90 h). El límite es <b>opcional</b>: en Plan, el interruptor «Límite horario» lo activa o no (por defecto: activado para BRM/PBP, desactivado para una salida libre).</p>', true],
  ['🏠 Inicio y recorridos', '<p>Cada tarjeta es un recorrido (distancia, desnivel, límite, estado). Tócala para abrirla. El icono 🗑 la elimina tras confirmación.</p><p>Los recorridos próximos se ordenan por fecha de salida, los terminados al final.</p>'],
  ['🌤️ Menú, tiempo e importación', '<p><b>☰</b> (arriba a la izquierda) abre el menú: Recorridos, Agenda, importar GPX, Ajustes, Ayuda, Acerca de.</p><p>El inicio muestra el tiempo en tu ubicación (leída al abrir la app, con las próximas horas). Sin conexión se conserva el último tiempo.</p><p><b>Obtener un recorrido</b>: toca Strava, Komoot, Garmin o Ride with GPS para ver cómo exportar el GPX y luego «Elegir el archivo GPX». Una conexión directa a la cuenta no es posible sin servidor.</p>'],
  ['📅 Agenda', '<p>El calendario muestra un punto por salida (azul BRM, naranja PBP, verde salida libre). Toca un día para ver sus salidas, «ver todo» para volver a la lista.</p><p><b>Planificar una salida</b>: elige la fecha, el tipo y luego «Nuevo GPX…» o la copia de un recorrido ya importado (útil para un recorrido que repites). La copia empieza sin posiciones ni tiempo.</p>'],
  ['🗺️ Pestaña Plan', '<ul><li><b>Salida</b>: hora de salida. El interruptor <b>Límite horario</b> activa o no un tiempo máximo (activado por defecto para BRM o PBP, desactivado para una salida libre); activado, muestra margen y velocidad mínima.</li><li><b>Etapas</b>: para cada control, la <b>distancia desde la etapa anterior</b> (+ X km bajo el nombre), el <b>nombre (tócalo: el texto se selecciona, o ✕ para borrarlo, y escribe el nuevo)</b>, el km, la <b>velocidad media en marcha</b> para llegar desde el anterior y la <b>parada</b> en minutos (90 min o más = sueño 🌙).</li><li><b>Misma velocidad</b>: aplica una velocidad a todas las etapas de golpe.</li><li><b>Tolerancia GPS</b>: distancia máxima entre tú y el track para registrar tu posición (3 km por defecto; pon 10 km para una prueba en tren).</li><li><b>Proyección de la llegada</b>: «plan previsto desplazado por mi desfase» o «al ritmo real observado».</li><li><b>Duplicar / Eliminar</b> el recorrido.</li></ul>'],
  ['📍 Seguir en carrera', '<p><b>Posición GPS</b>: la app lee tu posición al abrirla o al tocar el botón, la proyecta sobre el track y registra un punto. <b>No hay seguimiento en segundo plano</b>: se preserva la batería.</p><p><b>Anotar un paso</b>: para apuntar a mano la hora a la que pasaste por un control (hora exacta). Útil sin señal GPS o para corregir.</p><p>La pantalla de inicio del recorrido indica tu <b>adelanto / retraso</b> sobre lo previsto, el margen sobre el límite, la velocidad mínima para cumplir el plazo y los próximos pasos recalculados.</p>'],
  ['🏁 Modo carrera (pantalla simplificada)', '<p>Botón «🏁 Modo carrera» arriba en el Inicio del recorrido. Pensado para el cansancio: números grandes, un solo botón.</p><ul><li><b>Carrera</b>: adelanto/retraso, próxima etapa (km, <b>distancia restante hasta ella</b>, hora estimada, hora prevista), resto y llegada. El botón <b>«Estoy en la etapa»</b> abre el registro; el icono de diana (arriba a la derecha) actualiza el GPS.</li><li><b>Etapas</b>: hoja de ruta, la siguiente va enmarcada.</li><li><b>Tiempo</b>: temperatura, lluvia y viento en las próximas etapas.</li><li><b>Registro</b>: se propone la hora, ajusta con −5 / +5 min y luego <b>Validar</b>.</li><li><b>Detalles</b>: vuelta a la app completa.</li></ul><p>Sin etapas intermedias, la pantalla se simplifica y el botón grande pasa a ser «Mi posición».</p>'],
  ['📋 Pestaña Ruta (hoja de ruta)', '<p>Tabla <b>previsto / real / desfase ±</b>. <b>Toca una etapa</b> para anotar o corregir su hora de paso (tantas veces como haga falta, con «Eliminar este paso» para anularlo). Los pasos ya realizados usan la hora real (exacta si se anotó a mano, «≈» si se interpoló). Los siguientes muestran una estimación en cursiva.</p>'],
  ['🌦️ Mapa y tiempo', '<ul><li><b>Flechas</b> a lo largo del trazado: dirección del viento (hacia dónde sopla). <span style="color:#ef4444">Rojo</span> = de frente, <span style="color:#22c55e">verde</span> = de cola, gris = de lado. Toca una flecha para el detalle.</li><li><b>Color del trayecto</b>: <b>Pendiente</b> (por defecto: azul = bajada, verde &lt; 3 %, amarillo 3–6 %, naranja 6–9 %, rojo &gt; 9 %) o <b>Temperatura</b> (azul frío → rojo cálido). <b>Halo azul</b> = lluvia, más grueso si es más fuerte.</li><li><b>Capas</b>: Viento y Lluvia se activan por separado.</li><li><b>Momento mostrado</b>: «A mi paso» (tiempo a la hora prevista de paso en cada punto) o «Hora fija» con deslizador.</li><li><b>Anotar un paso desde el mapa</b>: toca el trazado y luego «Anotar un paso aquí»; el kilómetro viene rellenado, ajusta la hora y guarda. <b>Delante de mí / Todo el recorrido</b>: encuadre. Las etapas son los puntos morados con etiqueta.</li><li><b>Perfil de altitud</b> bajo el mapa: pendiente en color, etapas en punteado morado, tu posición (naranja). El <b>cursor</b> (o ▶ para «reproducir» el recorrido, ×1 a ×8) mueve un punto en el mapa y muestra km, altitud, pendiente, hora de paso y D+ restante. Toca o arrastra el perfil para ir a un lugar.</li><li><b>Curvas</b> bajo el mapa: temperatura y sensación, precipitaciones (probabilidad, intensidad) y nubes, viento y rachas, altitud, según la hora de paso.</li></ul><p>Las previsiones vienen de Open-Meteo y solo cubren <b>7 días</b>: para una salida más lejana, aparecen al acercarse. Sin conexión, se siguen mostrando los últimos datos recibidos.</p><p>El mapa base (OpenStreetMap) es opcional: desmárcalo para ahorrar datos; el trazado sigue visible.</p>'],
  ['💾 Copia de seguridad y datos', '<p>⚙ Ajustes → <b>Exportar</b> crea un archivo de copia de todos los recorridos (con los tracks) y abre el menú de compartir de Android: guárdalo en Drive, envíalo por correo o a tus archivos. <b>Importar</b> fusiona el archivo con tus recorridos actuales (un recorrido con el mismo identificador se reemplaza).</p><p>Los datos se guardan en la app. Desinstalarla los borra: exporta antes. Actualizar el APK sobre el anterior los conserva.</p>'],
  ['🌗 Día / noche', '<p>Botón <b>⚙</b> arriba: elige <b>Automático</b> (noche entre la puesta y la salida del sol, calculadas según tu recorrido), <b>Ajuste del teléfono</b>, <b>Día</b> o <b>Noche</b>.</p>'],
  ['🌐 Idioma', '<p>⚙ Ajustes → <b>Idioma</b>: français, English, Español o Deutsch. La app te pregunta el idioma en el primer arranque. Los nombres de etapas del GPX o escritos por ti no se traducen.</p>'],
  ['🛟 Solución de problemas', '<ul><li><b>«Permiso denegado»</b>: activa la ubicación para la app en los ajustes de Android.</li><li><b>«Posición a X km del recorrido: no registrada»</b>: estás fuera de la tolerancia. Aumenta la tolerancia en Plan o anota el paso a mano.</li><li><b>«Antes de la salida»</b>: la posición solo se registra desde 30 min antes de la hora de salida.</li><li><b>Tiempo no disponible</b>: sin red; vuelve a intentarlo con «↻ Actualizar».</li><li><b>Salida modificada pero horas sin cambios</b>: toca «↻ Actualizar» en Tiempo.</li><li><b>Botón atrás de Android</b>: vuelve a la lista de recorridos.</li></ul>']
 ], foot: 'MyBikePlanner · uso personal · estimaciones orientativas, no un cronometraje oficial.' },

de: { back: '‹ Zurück', title: 'Hilfe · MyBikePlanner', intro: 'Verfolge eine Tour (PBP, BRM …) gegenüber dem geplanten Zeitplan. Alles bleibt auf diesem Telefon: kein Konto, kein Server. Tippe auf einen Titel zum Aufklappen.',
 secs: [
  ['🚀 In 3 Schritten starten', '<ol><li><b>GPX importieren</b>: „＋ Neue Tour“ auf dem Startbildschirm oder über den Kalender („Tour planen“).</li><li>Wähle im Reiter <b>Plan</b> den <b>Typ</b> (Freie Tour, BRM oder PBP), das <b>Startdatum und die Startzeit</b> und danach die Geschwindigkeiten.</li><li>Am Tag selbst öffnest du die App und tippst auf <b>📍 GPS-Position</b>.</li></ol><p>Der Typ wird nie erraten: Du wählst ihn. Er legt die Höchstzeit fest (BRM 200 = 13 h 30, 300 = 20 h, 400 = 27 h, 600 = 40 h, 1000 = 75 h; PBP = 90 h). Das Limit ist <b>optional</b>: In Plan schaltet der Schalter „Zeitlimit“ es ein oder aus (Standard: an für BRM/PBP, aus für eine freie Tour).</p>', true],
  ['🏠 Start und Touren', '<p>Jede Karte ist eine Tour (Entfernung, Höhenmeter, Limit, Status). Tippe darauf, um sie zu öffnen. Das Symbol 🗑 löscht sie nach Bestätigung.</p><p>Kommende Touren sind nach Startdatum sortiert, beendete stehen unten.</p>'],
  ['🌤️ Menü, Wetter und Import', '<p><b>☰</b> (oben links) öffnet das Menü: Touren, Agenda, GPX-Import, Einstellungen, Hilfe, Über.</p><p>Der Startbildschirm zeigt das Wetter an deinem Standort (beim Öffnen der App gelesen, mit den nächsten Stunden). Offline bleibt das letzte Wetter erhalten.</p><p><b>Strecke holen</b>: Tippe auf Strava, Komoot, Garmin oder Ride with GPS, um den GPX-Export zu sehen, dann „GPX-Datei wählen“. Eine direkte Kontoverbindung ist ohne Server nicht möglich.</p>'],
  ['📅 Kalender', '<p>Der Kalender zeigt einen Punkt pro Tour (blau BRM, orange PBP, grün freie Tour). Tippe auf einen Tag, um seine Touren zu sehen, „alle anzeigen“ führt zur Liste zurück.</p><p><b>Tour planen</b>: Wähle Datum und Typ, dann „Neue GPX …“ oder die Kopie einer bereits importierten Tour (praktisch für eine mehrfach gefahrene Strecke). Die Kopie startet ohne Positionen und Wetter.</p>'],
  ['🗺️ Reiter Plan', '<ul><li><b>Start</b>: Startzeit. Der Schalter <b>Zeitlimit</b> schaltet eine Höchstzeit ein oder aus (Standard: an für BRM oder PBP, aus für eine freie Tour); wenn an, werden Reserve und Mindestgeschwindigkeit angezeigt.</li><li><b>Etappen</b>: für jede Kontrolle die <b>Entfernung ab der vorherigen Etappe</b> (+ X km unter dem Namen), der <b>Name (antippen: der Text wird markiert, oder ✕ zum Löschen, dann den neuen eingeben)</b>, der km, die <b>durchschnittliche Fahrgeschwindigkeit</b> ab der vorherigen Kontrolle und der <b>Halt</b> in Minuten (ab 90 min = Schlaf 🌙).</li><li><b>Gleiche Geschwindigkeit</b>: wendet eine Geschwindigkeit auf alle Etappen auf einmal an.</li><li><b>GPS-Toleranz</b>: maximale Entfernung zwischen dir und der Strecke, damit deine Position gespeichert wird (standardmäßig 3 km; für einen Test im Zug 10 km).</li><li><b>Ankunftsprognose</b>: „geplanter Ablauf, um meine Abweichung verschoben“ oder „mit meinem tatsächlichen Tempo“.</li><li><b>Duplizieren / Löschen</b> der Tour.</li></ul>'],
  ['📍 Unterwegs verfolgen', '<p><b>GPS-Position</b>: Die App liest deine Position beim Öffnen oder beim Tippen auf die Schaltfläche, projiziert sie auf die Strecke und speichert einen Punkt. Es gibt <b>keine Verfolgung im Hintergrund</b>: Der Akku wird geschont.</p><p><b>Durchfahrt eintragen</b>: um die Uhrzeit, zu der du eine Kontrolle passiert hast, von Hand zu notieren (genaue Zeit). Nützlich ohne GPS-Signal oder zum Korrigieren.</p><p>Der Startbildschirm der Tour zeigt deinen <b>Vorsprung / Rückstand</b> gegenüber dem Plan, die Reserve zum Limit, die Mindestgeschwindigkeit für das Zeitlimit und die neu berechneten nächsten Durchfahrten.</p>'],
  ['🏁 Rennmodus (reduzierte Anzeige)', '<p>Schaltfläche „🏁 Rennmodus“ oben im Start der Tour. Für müde Momente gedacht: große Zahlen, nur eine Schaltfläche.</p><ul><li><b>Rennen</b>: Vorsprung/Rückstand, nächste Etappe (km, <b>Restentfernung bis dorthin</b>, geschätzte Zeit, geplante Zeit), Restdistanz und Ziel. Die Schaltfläche <b>„Ich bin an der Etappe“</b> öffnet die Erfassung; das Zielsymbol (oben rechts) aktualisiert das GPS.</li><li><b>Etappen</b>: Streckenplan, die nächste ist umrahmt.</li><li><b>Wetter</b>: Temperatur, Regen und Wind an den nächsten Etappen.</li><li><b>Erfassung</b>: Die Zeit wird vorgeschlagen, passe sie mit −5 / +5 min an und tippe auf <b>Bestätigen</b>.</li><li><b>Details</b>: zurück zur vollständigen App.</li></ul><p>Ohne Zwischenetappen vereinfacht sich der Bildschirm und die große Schaltfläche heißt „Meine Position“.</p>'],
  ['📋 Reiter Route (Streckenplan)', '<p>Tabelle <b>geplant / Ist / Abweichung ±</b>. <b>Tippe auf eine Etappe</b>, um ihre Durchfahrtszeit einzutragen oder zu korrigieren (beliebig oft, mit „Diese Durchfahrt löschen“ zum Rückgängigmachen). Bereits absolvierte Durchfahrten verwenden die tatsächliche Zeit (exakt bei Handeingabe, „≈“ bei Interpolation). Die folgenden zeigen eine Schätzung in Kursivschrift.</p>'],
  ['🌦️ Karte und Wetter', '<ul><li><b>Pfeile</b> entlang der Strecke: Windrichtung (wohin er weht). <span style="color:#ef4444">Rot</span> = Gegenwind, <span style="color:#22c55e">grün</span> = Rückenwind, grau = Seitenwind. Tippe auf einen Pfeil für Details.</li><li><b>Streckenfarbe</b>: <b>Steigung</b> (Standard: blau = Gefälle, grün &lt; 3 %, gelb 3–6 %, orange 6–9 %, rot &gt; 9 %) oder <b>Temperatur</b> (kaltes Blau → warmes Rot). <b>Blauer Hof</b> = Regen, dicker bei stärkerem Regen.</li><li><b>Ebenen</b>: Wind und Regen lassen sich getrennt ein- und ausschalten.</li><li><b>Angezeigter Zeitpunkt</b>: „Bei meiner Durchfahrt“ (Wetter zur geplanten Durchfahrtszeit an jedem Punkt) oder „Feste Zeit“ mit Schieberegler.</li><li><b>Durchfahrt von der Karte eintragen</b>: Tippe auf die Strecke, dann auf „Durchfahrt hier eintragen“; der Kilometer ist vorausgefüllt, passe die Zeit an und speichere. <b>Vor mir / Ganze Strecke</b>: Ausschnitt. Etappen sind die beschrifteten violetten Punkte.</li><li><b>Höhenprofil</b> unter der Karte: Steigung farbig, Etappen als violette gepunktete Linien, deine Position (orange). Der <b>Cursor</b> (oder ▶, um die Strecke „abzuspielen“, ×1 bis ×8) bewegt einen Punkt auf der Karte und zeigt km, Höhe, Steigung, Durchfahrtszeit und verbleibende Hm. Tippe auf das Profil oder ziehe darauf, um zu einer Stelle zu springen.</li><li><b>Kurven</b> unter der Karte: Temperatur und gefühlte Temperatur, Niederschlag (Wahrscheinlichkeit, Intensität) und Wolken, Wind und Böen, Höhe, jeweils nach Durchfahrtszeit.</li></ul><p>Die Prognosen stammen von Open-Meteo und decken nur <b>7 Tage</b> ab: Bei späterem Start erscheinen sie kurz davor. Offline bleiben die zuletzt empfangenen Daten sichtbar.</p><p>Die Hintergrundkarte (OpenStreetMap) ist optional: Deaktiviere sie, um Daten zu sparen; die Strecke bleibt sichtbar.</p>'],
  ['💾 Sicherung und Daten', '<p>⚙ Einstellungen → <b>Exportieren</b> erstellt eine Sicherungsdatei aller Touren (inkl. Strecken) und öffnet das Android-Teilen: in Drive speichern, per E-Mail senden oder in deine Dateien legen. <b>Importieren</b> führt die Datei mit deinen aktuellen Touren zusammen (eine Tour mit gleicher Kennung wird ersetzt).</p><p>Die Daten werden in der App gespeichert. Beim Deinstallieren der App gehen sie verloren: vorher exportieren. Ein APK-Update über die alte Version behält sie.</p>'],
  ['🌗 Tag / Nacht', '<p>Schaltfläche <b>⚙</b> oben: Wähle <b>Automatisch</b> (Nacht zwischen Sonnenuntergang und -aufgang, berechnet anhand deiner Strecke), <b>Telefoneinstellung</b>, <b>Tag</b> oder <b>Nacht</b>.</p>'],
  ['🌐 Sprache', '<p>⚙ Einstellungen → <b>Sprache</b>: français, English, Español oder Deutsch. Die App fragt beim allerersten Start nach der Sprache. Etappennamen aus dem GPX oder von dir eingegebene werden nicht übersetzt.</p>'],
  ['🛟 Fehlerbehebung', '<ul><li><b>„Berechtigung verweigert“</b>: Aktiviere den Standort für die App in den Android-Einstellungen.</li><li><b>„Position X km von der Strecke entfernt: nicht gespeichert“</b>: Du bist außerhalb der Toleranz. Erhöhe die Toleranz in Plan oder trage die Durchfahrt von Hand ein.</li><li><b>„Vor dem Start“</b>: Die Position wird erst ab 30 min vor der Startzeit gespeichert.</li><li><b>Wetter nicht verfügbar</b>: kein Netz; versuche es erneut mit „↻ Aktualisieren“.</li><li><b>Start geändert, aber Zeiten unverändert</b>: Tippe im Wetter auf „↻ Aktualisieren“.</li><li><b>Android-Zurück-Taste</b>: führt zur Tourenliste zurück.</li></ul>']
 ], foot: 'MyBikePlanner · persönliche Nutzung · Richtwerte, keine offizielle Zeitmessung.' }

function chartSvg(xs, series, o) {

  if (R[2]) for (let v = R[2].lo; v <= R[2].hi + 1e-9; v += R[2].st) { const y = sy(2, v); g += '<text x="' + (W - mr + 4) + '" y="' + (y + 3) + '">' + (Math.round(v * 10) / 10) + '</text>'; }
  for (let i = 0; i < 4; i++) { const x = x0 + i * (x1 - x0) / 3, px = sx(x); g += '<line x1="' + px + '" x2="' + px + '" y1="' + mt + '" y2="' + (mt + ph) + '" style="stroke:var(--line)" stroke-width="1"/><text x="' + Math.min(Math.max(px, ml + 14), W - mr - 14) + '" y="' + (H - 6) + '" text-anchor="middle">' + o.xfmt(x) + '</text>'; }
  for (const s of series) {
    const ax = s.axis || 1; if (!R[ax]) continue;
    let d = '', seg = [];
    const flush = () => {
      if (seg.length > 1) {
        const pts = seg.map(p => sx(p[0]).toFixed(1) + ' ' + sy(ax, p[1]).toFixed(1));
        if (s.fill) d += '<path d="M' + sx(seg[0][0]).toFixed(1) + ' ' + (mt + ph) + 'L' + pts.join('L') + 'L' + sx(seg[seg.length - 1][0]).toFixed(1) + ' ' + (mt + ph) + 'Z" fill="' + s.color + '" fill-opacity="' + (s.fo || .22) + '"/>';
        d += '<path d="M' + pts.join('L') + '" fill="none" stroke="' + s.color + '" stroke-width="1.6" stroke-linejoin="round"/>';
      }
      seg = [];
    };
    xs.forEach((x, i) => { const v = s.vals[i]; if (v == null) flush(); else seg.push([x, v]); }); flush();
    g += d;

  if (o.nowX != null && o.nowX >= x0 && o.nowX <= x1) { const px = sx(o.nowX); g += '<line x1="' + px + '" x2="' + px + '" y1="' + mt + '" y2="' + (mt + ph) + '" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="3 3"/>'; }
  return '<svg class="ch" viewBox="0 0 ' + W + ' ' + H + '">' + g + '</svg>' +
    '<div class="leg">' + series.map(s => '<span><i style="background:' + s.color + '"></i>' + s.name + '</span>').join('') + (o.nowX != null && o.nowX >= x0 && o.nowX <= x1 ? '<span><i style="background:#fbbf24"></i>maintenant</span>' : '') + '</div>';
}
