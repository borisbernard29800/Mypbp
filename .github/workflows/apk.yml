name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mypbp-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publier l'APK dans les Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk mybikeplanner.apk
          gh release delete latest --yes --cleanup-tag --repo ${{ github.repository }} || true
          gh release create latest mybikeplanner.apk --repo ${{ github.repository }} --target ${{ github.sha }} --title "MyBikePlanner (APK)" --notes "APK à installer sur Android (signature fixe : les mises à jour conservent les données)."
